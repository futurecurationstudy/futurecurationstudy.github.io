<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>iPad 뷰포트 확인용 (임시)</title>
<style>
html,body{margin:0;background:#111;color:#888;font:12px sans-serif}
.wrap{display:flex;gap:16px;padding:12px}
.cell{transform-origin:top left}
.label{margin-bottom:6px}
iframe{border:1px solid #444;background:#000}
</style></head>
<body>
<div class="wrap">
  <div class="cell" style="transform:scale(.7)">
    <div class="label">iPad 세로 820 x 1180</div>
    <iframe src="https://futurecurationstudy.github.io/" width="820" height="1180"></iframe>
  </div>
  <div class="cell" style="transform:scale(.8)">
    <div class="label">iPad 가로 1180 x 820</div>
    <iframe src="https://futurecurationstudy.github.io/" width="1180" height="820"></iframe>
  </div>
</div>
</body></html>
